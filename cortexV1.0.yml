name: cortexV1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack embedded Cortex project
        run: |
          base64 -d > cortex.zip <<'CORTEX_ZIP_EOF'

          CORTEX_ZIP_EOF
          unzip -q cortex.zip
          ls -la
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages (runner's preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Name the APK cortexV1.0
        run: cp app/build/outputs/apk/debug/app-debug.apk cortexV1.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: cortexV1.0
          path: cortexV1.0.apk
          if-no-files-found: error
